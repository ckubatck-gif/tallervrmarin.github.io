        }

        function BudgetTable({ snap }) {
            return (
                <>
                    <table className="w-full text-left border-collapse">
                        <thead>
                            <tr className="border-b-2 border-slate-400">
                                <th className="py-2 pr-2">Concepto</th><th className="py-2 px-2 text-center">Cantidad</th>
                                <th className="py-2 px-2 text-right">Precio ud. (sin IVA)</th><th className="py-2 pl-2 text-right">Importe</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200">
                            {snap.labor.length > 0 && <tr><td colSpan="4" className="pt-3 pb-1 font-bold text-[11px] uppercase text-slate-500">Mano de obra</td></tr>}
                            {snap.labor.map((l, i) => (
                                <tr key={'l' + i}><td className="py-1.5 pr-2">{l.desc}</td><td className="py-1.5 px-2 text-center">{num(l.hours)} h</td><td className="py-1.5 px-2 text-right">{eur(l.rate)}</td><td className="py-1.5 pl-2 text-right">{eur(l.amount)}</td></tr>
                            ))}
                            {snap.parts.length > 0 && <tr><td colSpan="4" className="pt-3 pb-1 font-bold text-[11px] uppercase text-slate-500">Recambios y materiales</td></tr>}
                            {snap.parts.map((p, i) => (
                                <tr key={'p' + i}><td className="py-1.5 pr-2">{p.desc}{p.brand ? ` (${p.brand})` : ''}</td><td className="py-1.5 px-2 text-center">{num(p.qty)}</td><td className="py-1.5 px-2 text-right">{eur(p.price)}</td><td className="py-1.5 pl-2 text-right">{eur(p.amount)}</td></tr>
                            ))}
                        </tbody>
                    </table>
                    <div className="flex justify-end mt-3 avoid-break">
                        <div className="w-72 space-y-1">
                            <div className="flex justify-between"><span>Total sin IVA</span><span>{eur(snap.base)}</span></div>
                            <div className="flex justify-between"><span>IVA {num(snap.ivaRate)} %</span><span>{eur(snap.iva)}</span></div>
                            <div className="flex justify-between font-black text-base border-t border-slate-400 pt-1"><span>TOTAL</span><span>{eur(snap.total)}</span></div>
                        </div>
                    </div>
                </>
            );
        }

        // =====================================================================
        // CLIENTES Y VEHÍCULOS
        // =====================================================================
        function Clients({ db, api }) {
            const [q, setQ] = useState('');
            const query = q.trim().toLowerCase();
            const list = db.clients.filter(c => {
                if (!query) return true;
                const plates = db.vehicles.filter(v => v.client_id === c.id).map(v => v.license_plate.toLowerCase());
                return c.name.toLowerCase().includes(query) || (c.nif || '').toLowerCase().includes(query) || plates.some(p => p.includes(query));
            });

            const removeClient = (c) => {
                if (db.vehicles.some(v => v.client_id === c.id)) { api.notify('Este cliente tiene vehículos. Elimínalos antes (solo se puede si no tienen órdenes).', 'error'); return; }
                api.ask({ title: 'Eliminar cliente', danger: true, confirmLabel: 'Eliminar', message: `¿Eliminar a ${c.name}?`, onConfirm: () => api.del('clients', c.id) });
            };
            const removeVehicle = (v) => {

        function VehicleModal({ db, vehicle, onClose, api }) {
            const [f, setF] = useState({ client_id: '', license_plate: '', brand: '', model: '', year: '', ...(vehicle || {}) });

                e.preventDefault();

                const norm = (p) => p.replace(/[\s-]/g, '');

                const data = { client_id: f.client_id, license_plate: plate, brand: f.brand.trim(), model: f.model.trim(), year: f.year };

                onClose();
            };

                <Modal title={vehicle?.id ? 'Editar vehículo' : 'Nuevo vehículo'} onClose={onClose}>

                        <div className="grid grid-cols-2 gap-3">

        // =====================================================================
        // TRABAJADORES
        // =====================================================================
        function Workers({ db, api }) {
            const [from, to] = monthRange();
            const remove = (w) => {
                if (db.tasks.some(t => t.worker_id === w.id)) {
                    api.ask({
                        title: 'No se puede eliminar', confirmLabel: 'Marcar como inactivo',
                        message: `${w.name} tiene horas registradas en órdenes. Eliminarlo cambiaría los costes de órdenes ya cerradas. Se puede marcar como "Inactivo": deja de aparecer para nuevas tareas y se conserva el histórico.`,
                        onConfirm: () => api.upd('workers', w.id, { status: 'Inactivo' }),
                    });
                    return;
                }
                api.ask({ title: 'Eliminar trabajador', danger: true, confirmLabel: 'Eliminar', message: `¿Eliminar a ${w.name}?`, onConfirm: () => api.del('workers', w.id) });
            };
            return (
                <div className="space-y-5 max-w-7xl mx-auto">
                    <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                        <h2 className="text-lg font-bold text-white">Trabajadores</h2>
                        <button onClick={() => api.setModal({ type: 'worker' })} className={btnPrimary}>+ Nuevo trabajador</button>
                    </div>
                    <p className="text-xs text-slate-500">El <strong>coste/hora</strong> es lo que le cuesta al taller cada hora del trabajador (salario bruto + Seguridad Social a cargo de la empresa + parte proporcional de vacaciones y horas no productivas). No es lo que se cobra al cliente. Pídeselo a la gestoría.</p>
                    {db.workers.length === 0 && <p className="text-sm text-slate-500">No hay trabajadores.</p>}
                    <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                        {db.workers.map(w => {
                            const monthHours = db.tasks.filter(t => t.worker_id === w.id).reduce((a, t) => {
                                const o = db.orders.find(o => o.id === t.order_id);
                                return o && o.close_date && o.close_date >= from && o.close_date <= to ? a + n(t.hours_real) : a;
                            }, 0);
                            const style = w.status === 'Activo' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : w.status === 'Inactivo' ? 'bg-slate-700/40 text-slate-400 border-slate-600' : w.status === 'De vacaciones' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';
                            return (
                                <Card key={w.id}>
                                    <div className="flex justify-between items-start">
                                        <div>
                                            <h3 className="font-bold text-white">{w.name}</h3>
                                            <span className={`inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold border ${style}`}>● {w.status}</span>
                                        </div>
                                        <div className="flex gap-2 text-xs">
                                            <button className="text-slate-400 hover:text-white underline" onClick={() => api.setModal({ type: 'worker', data: w })}>Editar</button>
                                            <button className="text-slate-500 hover:text-rose-400" onClick={() => remove(w)}>🗑️</button>
                                        </div>
                                    </div>
                                    <div className="border-t border-slate-800 mt-3 pt-3 text-sm space-y-1">
                                        <Row label="Coste/hora" value={`${eur(w.cost_hour)}/h`} />
                                        <Row label="Horas reales este mes" value={`${num(monthHours)} h`} />
                                    </div>
                                </Card>
                            );
                        })}
                    </div>
                </div>
            );
        }

                const data = { name: f.name.trim(), cost_hour: n(f.cost_hour), status: f.status };

        // =====================================================================
        // RENTABILIDAD / INFORMES
        // =====================================================================
        function Reports({ db, openOrder }) {
            const [initFrom, initTo] = monthRange();
            const [from, setFrom] = useState(initFrom);
            const [to, setTo] = useState(initTo);

            const rows = db.orders
                .filter(o => CLOSED.includes(o.status) && o.close_date && o.close_date >= from && o.close_date <= to)
                .sort((a, b) => a.close_date.localeCompare(b.close_date))
                .map(o => ({ o, c: orderCalc(db, o.id), ...orderContext(db, o) }));
            const t = rows.reduce((a, r) => ({
                base: a.base + r.c.billedBase, iva: a.iva + r.c.iva, labor: a.labor + r.c.laborCost, parts: a.parts + r.c.partsCost,
            }), { base: 0, iva: 0, labor: 0, parts: 0 });
            const cost = t.labor + t.parts, profit = t.base - cost;

            const byWorker = db.workers.map(w => {
                const hours = rows.reduce((a, r) => a + db.tasks.filter(tk => tk.order_id === r.o.id && tk.worker_id === w.id).reduce((x, tk) => x + n(tk.hours_real), 0), 0);
                return { w, hours };
            }).filter(x => x.hours > 0);

            return (
                <div className="space-y-5 max-w-7xl mx-auto">
                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex flex-wrap justify-between items-center gap-3">
                        <h2 className="text-lg font-bold text-white">Rentabilidad</h2>
                        <div className="flex flex-wrap items-center gap-2 text-xs">
                            <label className="text-slate-400">Desde <input type="date" value={from} onChange={(e) => setFrom(e.target.value)} className={`${inputCls} w-auto inline-block ml-1`} /></label>
                            <label className="text-slate-400">Hasta <input type="date" value={to} onChange={(e) => setTo(e.target.value)} className={`${inputCls} w-auto inline-block ml-1`} /></label>
                        </div>
                    </div>
                    <p className="text-xs text-slate-500">Incluye órdenes terminadas o entregadas con fecha de cierre en el periodo. Importes sin IVA. Es una estimación de gestión, no contabilidad: no incluye alquiler, suministros, herramientas ni otros gastos fijos.</p>
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                        <Kpi label="Facturable (base)" value={eur(t.base)} color="text-emerald-400" />
                        <Kpi label="Costes directos" value={eur(cost)} color="text-rose-400" />
                        <Kpi label="Beneficio directo" value={eur(profit)} color={profit >= 0 ? 'text-orange-400' : 'text-rose-400'} />
                        <Kpi label="Margen" value={t.base > 0 ? `${num(profit / t.base * 100)} %` : '—'} />
                    </div>
                    <Card title={`Órdenes cerradas (${rows.length})`}>
                        {rows.length === 0 ? <p className="text-sm text-slate-500">No hay órdenes cerradas en este periodo.</p> : (
                            <div className="overflow-x-auto">
                                <table className="w-full text-sm min-w-[720px]">
                                    <thead><tr className="text-left text-xs uppercase text-slate-400 border-b border-slate-800">
                                        <th className="pb-2 px-2">Cierre</th><th className="pb-2 px-2">Orden</th><th className="pb-2 px-2">Matrícula</th><th className="pb-2 px-2">Cliente</th>
                                        <th className="pb-2 px-2 text-right">Base</th><th className="pb-2 px-2 text-right">Coste</th><th className="pb-2 px-2 text-right">Beneficio</th>
                                    </tr></thead>
                                    <tbody className="divide-y divide-slate-800">
                                        {rows.map(({ o, c, vehicle, client }) => (
                                            <tr key={o.id} className="hover:bg-slate-800/40 cursor-pointer" onClick={() => openOrder(o.id)}>
                                                <td className="py-2 px-2">{fmtDate(o.close_date)}</td><td className="py-2 px-2 font-bold">{o.number}</td>
                                                <td className="py-2 px-2 font-mono text-orange-400">{vehicle?.license_plate}</td><td className="py-2 px-2">{client?.name}</td>
                                                <td className="py-2 px-2 text-right">{eur(c.billedBase)}</td><td className="py-2 px-2 text-right">{eur(c.cost)}</td>
                                                <td className={`py-2 px-2 text-right font-bold ${c.profit >= 0 ? 'text-orange-400' : 'text-rose-400'}`}>{eur(c.profit)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                        <p className="text-[11px] text-slate-500 mt-3">IVA repercutido en el periodo (informativo, se ingresa a Hacienda): {eur(t.iva)}. Coste mano de obra {eur(t.labor)} · coste recambios {eur(t.parts)}.</p>
                    </Card>
                    {byWorker.length > 0 && (
                        <Card title="Horas reales por trabajador en el periodo">
                            <div className="space-y-1 text-sm">{byWorker.map(({ w, hours }) => <Row key={w.id} label={w.name} value={`${num(hours)} h`} />)}</div>
                        </Card>
                    )}
                </div>
            );
        }

        // =====================================================================
        // AJUSTES
        // =====================================================================
        function Settings({ db, api }) {
            const s = db.settings;
            const logoInput = useRef(null);
            const importInput = useRef(null);
            const set = (k) => (e) => api.setSettings({ [k]: e.target.value });

            const onLogo = (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                if (!/^image\/(png|jpeg|webp|svg\+xml)$/.test(f.type)) { api.notify('Formato no admitido. Usa PNG, JPG, WEBP o SVG.', 'error'); return; }
                if (f.size > 700 * 1024) { api.notify('El logo pesa demasiado (máximo 700 KB). Redúcelo antes de subirlo.', 'error'); return; }
                const r = new FileReader();
                r.onload = () => { api.setSettings({ logo: r.result }); api.notify('Logo actualizado.'); };
                r.onerror = () => api.notify('No se ha podido leer el archivo.', 'error');
                r.readAsDataURL(f);
            };

            const exportData = () => {
                const blob = new Blob([JSON.stringify(db, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = `copia-taller-${todayISO()}.json`;
                document.body.appendChild(a); a.click(); a.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const onImport = (e) => {
                const f = e.target.files && e.target.files[0];
                e.target.value = '';
                if (!f) return;
                const r = new FileReader();
                r.onload = () => {
                    try {
                        const p = JSON.parse(r.result);
                        if (!isValidDb(p)) throw new Error('formato');
                        api.ask({
                            title: 'Restaurar copia', danger: true, confirmLabel: 'Restaurar',
                            message: `Se sustituirán TODOS los datos actuales por los de la copia (${p.orders.length} órdenes, ${p.clients.length} clientes).`,
                            onConfirm: () => { api.setDb(normalize(p)); api.notify('Copia restaurada.'); },
                        });
                    } catch (err) { api.notify('El archivo no es una copia válida de esta aplicación.', 'error'); }
                };
                r.readAsText(f);
            };

            return (
                <div className="space-y-5 max-w-3xl mx-auto">
                    <Card title="Datos del taller" right={<span className="text-[11px] text-slate-500">Aparecen en presupuestos y resguardos</span>}>
                        <div className="grid md:grid-cols-2 gap-4">
                            <Field label="Nombre" className="md:col-span-2"><input value={s.name} onChange={set('name')} className={inputCls} /></Field>
                            <Field label="NIF"><input value={s.nif} onChange={(e) => api.setSettings({ nif: e.target.value.toUpperCase() })} className={inputCls} /></Field>
                            <Field label="Nº de identificación del taller" hint="El que asigna la Xunta tras la declaración responsable (8 dígitos)"><input value={s.regNumber} onChange={set('regNumber')} className={inputCls} /></Field>
                            <Field label="Domicilio" className="md:col-span-2"><input value={s.address} onChange={set('address')} className={inputCls} /></Field>
                            <Field label="Teléfono"><input type="tel" value={s.phone} onChange={set('phone')} className={inputCls} /></Field>
                            <Field label="Email"><input type="email" value={s.email} onChange={set('email')} className={inputCls} /></Field>
                        </div>
                    </Card>

                    <Card title="Logotipo">
                        <div className="flex flex-wrap items-center gap-5">
                            <div className="bg-white rounded-xl p-3"><Logo settings={s} className="w-40 h-28" /></div>
                            <div className="space-y-2">
                                <input ref={logoInput} type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml" onChange={onLogo} className="hidden" />
                                <button className={btnPrimary} onClick={() => logoInput.current.click()}>Cambiar logo</button>
                                {s.logo && <button className={`${btnSecondary} ml-2`} onClick={() => api.setSettings({ logo: null })}>Volver al logo original</button>}
                                <p className="text-[11px] text-slate-500">PNG con fondo transparente o SVG, máximo 700 KB. Sale en la aplicación y en los documentos impresos.</p>
                            </div>
                        </div>
                    </Card>

                    <Card title="Precios">
                        <div className="grid md:grid-cols-3 gap-4">
                            <Field label="Precio hora mano de obra (€ sin IVA)" hint="Lo que se cobra al cliente"><input type="number" step="0.01" min="0" value={s.hourRate} onChange={set('hourRate')} className={inputCls} /></Field>
                            <Field label="IVA (%)"><input type="number" step="0.01" min="0" value={s.ivaRate} onChange={set('ivaRate')} className={inputCls} /></Field>
                            <Field label="Validez del presupuesto (días hábiles)" hint="Mínimo legal: 12 (art. 14.1)">
                                <input type="number" min="12" value={s.validityDays} onChange={set('validityDays')} onBlur={() => { if (n(s.validityDays) < 12) api.setSettings({ validityDays: 12 }); }} className={inputCls} />
                            </Field>
                        </div>
                        <p className="text-[11px] text-slate-500 mt-3">Los días hábiles se cuentan de lunes a viernes, sin descontar festivos. Si cae un festivo en medio, la validez real es algo mayor.</p>
                    </Card>

                    <Card title="Copia de seguridad">
                        <p className="text-sm text-slate-400 mb-3">Los datos se guardan <strong>solo en este navegador y en este ordenador</strong>. Si se borra el historial del navegador o se cambia de equipo, se pierden. Descarga una copia con frecuencia (por ejemplo, cada viernes) y guárdala fuera del ordenador.</p>
                        <div className="flex flex-wrap gap-3">
                            <button className={btnPrimary} onClick={exportData}>⬇️ Descargar copia</button>
                            <input ref={importInput} type="file" accept="application/json,.json" onChange={onImport} className="hidden" />
                            <button className={btnSecondary} onClick={() => importInput.current.click()}>⬆️ Restaurar copia</button>
                        </div>
                    </Card>

                    <Card title="Zona de peligro">
                        <button className={btnDanger} onClick={() => api.ask({
                            title: 'Borrar todos los datos', danger: true, confirmLabel: 'Borrar todo',
                            message: 'Se eliminarán todas las órdenes, clientes, vehículos y trabajadores. Se conservan los ajustes y el logo. Descarga antes una copia si la necesitas.',
                            onConfirm: () => api.setDb(prev => emptyDb(prev.settings)),
                        })}>Borrar todos los datos</button>
                    </Card>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
