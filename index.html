<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VR Automoción ESPJ - Gestión de Taller</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            900: '#0f172a',
                            950: '#090d16',
                        },
                        orange: {
                            500: '#f97316',
                            600: '#ea580c',
                        }
                    }
                }
            }
        }
    </script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel Standalone para JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @media print {
            .no-print {
                display: none !important;
            }
            body {
                background-color: white !important;
                color: black !important;
            }
            .print-only {
                display: block !important;
            }
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useMemo } = React;

        // --- COMPONENTE DE LOGOTIPO CORPORATIVO ESTABLE ---
        const WorkshopLogo = ({ className = "w-10 h-10" }) => (
            <div className={`bg-orange-500 rounded-xl flex flex-col items-center justify-center shadow-lg shadow-orange-500/20 p-1 overflow-hidden border border-orange-400 ${className}`}>
                <span className="text-slate-950 font-black text-lg tracking-tighter leading-none">VR</span>
                <span className="text-slate-900 font-extrabold text-[8px] tracking-normal uppercase">AUTO</span>
            </div>
        );

        // --- DATOS DE EJEMPLO INICIALES ---
        const initialWorkers = [
            { id: 1, name: 'Juan Pérez', cost_hour: 15, status: 'Activo' },
            { id: 2, name: 'Carlos López', cost_hour: 20, status: 'De vacaciones' },
        ];

        const initialClients = [
            { id: 1, name: 'Empresa de Transportes S.A.', nif: 'B12345678', address: 'Calle Mayor 12, Pontevedra', phone: '600123456', email: 'contacto@trans.sa' },
            { id: 2, name: 'María Gómez', nif: '71234567A', address: 'Avenida Libertad 4, Marín', phone: '655987654', email: 'maria@gomez.com' },
        ];

        const initialVehicles = [
            { id: 1, client_id: 1, license_plate: '1234 ABC', brand: 'Ford', model: 'Transit', year: 2018 },
            { id: 2, client_id: 2, license_plate: '5678 XYZ', brand: 'Toyota', model: 'Corolla', year: 2021 },
        ];

        const initialOrders = [
            { id: 1, vehicle_id: 1, status: 'Terminada', open_date: '2026-10-15', delivery_date: '2026-10-18', charged_price: 450 },
            { id: 2, vehicle_id: 2, status: 'Abierta', open_date: '2026-10-20', delivery_date: '', charged_price: 0 },
        ];

        const initialTasks = [
            { id: 1, order_id: 1, description: 'Revisión general y cambio de aceite', worker_id: 1, hours: 2.5 },
            { id: 2, order_id: 1, description: 'Alineación de dirección', worker_id: 2, hours: 1 },
        ];

        const initialParts = [
            { id: 1, order_id: 1, description: 'Lata Aceite 5W30', quantity: 1, unit_cost: 35 },
            { id: 2, order_id: 1, description: 'Filtro de aceite', quantity: 1, unit_cost: 15 },
        ];

        function App() {
            const [activeTab, setActiveTab] = useState('panel');

            // Datos del taller oficiales
            const [workshopInfo] = useState({
                name: 'VR Automoción ESPJ',
                nif: 'E88935036',
                address: 'Calle Tiro Naval Janer 11, Marín, Pontevedra',
                phone: '600000000',
                email: 'contacto@vrautomocion.com'
            });

            // Tablas de datos en memoria
            const [workers, setWorkers] = useState(initialWorkers);
            const [clients, setClients] = useState(initialClients);
            const [vehicles, setVehicles] = useState(initialVehicles);
            const [orders, setOrders] = useState(initialOrders);
            const [tasks, setTasks] = useState(initialTasks);
            const [parts, setParts] = useState(initialParts);
            const [invoices, setInvoices] = useState([
                {
                    id: 1,
                    order_id: 1,
                    invoice_number: 'FAC-2026-0001',
                    date: '2026-10-18',
                    client_name: 'Empresa de Transportes S.A.',
                    client_nif: 'B12345678',
                    client_address: 'Calle Mayor 12, Pontevedra',
                    lines: [
                        { desc: 'Mano de Obra: Revisión general y cambio de aceite', qty: 1, amount: 200 },
                        { desc: 'Mano de Obra: Alineación de dirección', qty: 1, amount: 100 },
                        { desc: 'Recambio: Lata Aceite 5W30', qty: 1, amount: 35 },
                        { desc: 'Recambio: Filtro de aceite', qty: 1, amount: 15 },
                        { desc: 'Ajuste comercial / Servicios adicionales', qty: 1, amount: 100 }
                    ],
                    subtotal: 371.90,
                    iva: 78.10,
                    total: 450.00,
                    notes: 'Vehículo entregado conforme.'
                }
            ]);

            const [orderSearch, setOrderSearch] = useState('');
            const [selectedOrderId, setSelectedOrderId] = useState(null);
            const [activeInvoice, setActiveInvoice] = useState(null);

            // Modales
            const [showNewOrderModal, setShowNewOrderModal] = useState(false);
            const [showNewClientModal, setShowNewClientModal] = useState(false);
            const [showNewWorkerModal, setShowNewWorkerModal] = useState(false);
            const [showNewVehicleModal, setShowNewVehicleModal] = useState(false);
            const [workerToDelete, setWorkerToDelete] = useState(null);

            // Formularios
            const [newOrderForm, setNewOrderForm] = useState({ vehicle_id: '', open_date: new Date().toISOString().split('T')[0] });
            const [newClientForm, setNewClientForm] = useState({ name: '', nif: '', address: '', phone: '', email: '' });
            const [newWorkerForm, setNewWorkerForm] = useState({ name: '', cost_hour: '', status: 'Activo' });
            const [newVehicleForm, setNewVehicleForm] = useState({ client_id: '', license_plate: '', brand: '', model: '', year: 2022 });

            const [newTaskForm, setNewTaskForm] = useState({ description: '', worker_id: '', hours: '' });
            const [newPartForm, setNewPartForm] = useState({ description: '', quantity: 1, unit_cost: '' });

            const [reportStart, setReportStart] = useState('2026-10-01');
            const [reportEnd, setReportEnd] = useState('2026-10-31');

            const getOrderCosts = (orderId) => {
                const orderTasks = tasks.filter(t => t.order_id === orderId);
                const orderParts = parts.filter(p => p.order_id === orderId);

                let laborCost = 0;
                orderTasks.forEach(t => {
                    const worker = workers.find(w => w.id === Number(t.worker_id));
                    const costHour = worker ? worker.cost_hour : 0;
                    laborCost += Number(t.hours) * costHour;
                });

                let partsCost = 0;
                orderParts.forEach(p => {
                    partsCost += Number(p.quantity) * Number(p.unit_cost);
                });

                return { laborCost, partsCost, totalCost: laborCost + partsCost };
            };

            const financialSummary = useMemo(() => {
                let totalIncome = 0;
                let totalCosts = 0;
                orders.forEach(o => {
                    if (o.status === 'Terminada' || o.status === 'Entregada') {
                        totalIncome += Number(o.charged_price || 0);
                    }
                    const costs = getOrderCosts(o.id);
                    totalCosts += costs.totalCost;
                });
                return { income: totalIncome, costs: totalCosts, profit: totalIncome - totalCosts };
            }, [orders, tasks, parts, workers]);

            const handleSaveChargedPrice = (orderId, newPrice) => {
                const price = Number(newPrice);
                setOrders(orders.map(o => o.id === orderId ? { ...o, charged_price: price } : o));

                let invoice = invoices.find(i => i.order_id === orderId);
                const order = orders.find(o => o.id === orderId);
                const vehicle = vehicles.find(v => v.id === order.vehicle_id);
                const client = clients.find(c => c.id === vehicle?.client_id);

                if (invoice) {
                    const subtotal = Number((price / 1.21).toFixed(2));
                    const iva = Number((price - subtotal).toFixed(2));
                    const updatedInvoices = invoices.map(i => i.id === invoice.id ? { ...i, subtotal, iva, total: price } : i);
                    setInvoices(updatedInvoices);
                    setActiveInvoice(updatedInvoices.find(i => i.id === invoice.id));
                } else {
                    const nextNum = `FAC-2026-${String(invoices.length + 1).padStart(4, '0')}`;
                    const subtotal = Number((price / 1.21).toFixed(2));
                    const iva = Number((price - subtotal).toFixed(2));

                    const oTasks = tasks.filter(t => t.order_id === orderId);
                    const oParts = parts.filter(p => p.order_id === orderId);
                    let lines = [];
                    oTasks.forEach(t => { lines.push({ desc: `Mano de Obra: ${t.description} (${t.hours}h)`, qty: 1, amount: Number(t.hours) * 40 }); });
                    oParts.forEach(p => { lines.push({ desc: `Recambio: ${p.description}`, qty: p.quantity, amount: p.quantity * p.unit_cost * 1.3 }); });
                    if (lines.length === 0) lines.push({ desc: `Servicios de reparación y mantenimiento mecánico`, qty: 1, amount: price });

                    const newInv = {
                        id: Date.now(),
                        order_id: orderId,
                        invoice_number: nextNum,
                        date: new Date().toISOString().split('T')[0],
                        client_name: client ? client.name : 'Cliente Genérico',
                        client_nif: client ? client.nif : '00000000X',
                        client_address: client ? client.address : 'Dirección no especificada',
                        lines,
                        subtotal,
                        iva,
                        total: price,
                        notes: `Vehículo: ${vehicle?.brand} ${vehicle?.model} - Matrícula: ${vehicle?.license_plate}`
                    };

                    setInvoices([...invoices, newInv]);
                    setActiveInvoice(newInv);
                }
            };

            const createClient = (e) => {
                e.preventDefault();
                if (!newClientForm.name) return;
                const newId = clients.length > 0 ? Math.max(...clients.map(c => c.id)) + 1 : 1;
                setClients([...clients, { id: newId, ...newClientForm }]);
                setNewClientForm({ name: '', nif: '', address: '', phone: '', email: '' });
                setShowNewClientModal(false);
            };

            const createWorker = (e) => {
                e.preventDefault();
                if (!newWorkerForm.name || !newWorkerForm.cost_hour) return;
                const newId = workers.length > 0 ? Math.max(...workers.map(w => w.id)) + 1 : 1;
                setWorkers([...workers, { id: newId, name: newWorkerForm.name, cost_hour: Number(newWorkerForm.cost_hour), status: newWorkerForm.status }]);
                setNewWorkerForm({ name: '', cost_hour: '', status: 'Activo' });
                setShowNewWorkerModal(false);
            };

            const confirmDeleteWorker = () => {
                if (!workerToDelete) return;
                setWorkers(workers.filter(w => w.id !== workerToDelete.id));
                setWorkerToDelete(null);
            };

            const createVehicle = (e) => {
                e.preventDefault();
                if (!newVehicleForm.license_plate || !newVehicleForm.client_id) return;
                const newId = vehicles.length > 0 ? Math.max(...vehicles.map(v => v.id)) + 1 : 1;
                setVehicles([...vehicles, { id: newId, ...newVehicleForm, client_id: Number(newVehicleForm.client_id), year: Number(newVehicleForm.year) }]);
                setNewVehicleForm({ client_id: '', license_plate: '', brand: '', model: '', year: 2022 });
                setShowNewVehicleModal(false);
            };

            const createOrder = (e) => {
                e.preventDefault();
                if (!newOrderForm.vehicle_id) return;
                const newId = orders.length > 0 ? Math.max(...orders.map(o => o.id)) + 1 : 1;
                const created = { id: newId, vehicle_id: Number(newOrderForm.vehicle_id), status: 'Abierta', open_date: newOrderForm.open_date, delivery_date: '', charged_price: 0 };
                setOrders([...orders, created]);
                setNewOrderForm({ vehicle_id: '', open_date: new Date().toISOString().split('T')[0] });
                setShowNewOrderModal(false);
                setSelectedOrderId(newId);
            };

            const addTaskToOrder = (e) => {
                e.preventDefault();
                if (!selectedOrderId || !newTaskForm.description || !newTaskForm.worker_id || !newTaskForm.hours) return;
                const newId = tasks.length > 0 ? Math.max(...tasks.map(t => t.id)) + 1 : 1;
                setTasks([...tasks, { id: newId, order_id: selectedOrderId, description: newTaskForm.description, worker_id: Number(newTaskForm.worker_id), hours: Number(newTaskForm.hours) }]);
                setNewTaskForm({ description: '', worker_id: '', hours: '' });
            };

            const addPartToOrder = (e) => {
                e.preventDefault();
                if (!selectedOrderId || !newPartForm.description || !newPartForm.unit_cost) return;
                const newId = parts.length > 0 ? Math.max(...parts.map(p => p.id)) + 1 : 1;
                setParts([...parts, { id: newId, order_id: selectedOrderId, description: newPartForm.description, quantity: Number(newPartForm.quantity), unit_cost: Number(newPartForm.unit_cost) }]);
                setNewPartForm({ description: '', quantity: 1, unit_cost: '' });
            };

            // Funciones para editar tareas y recambios existentes
            const updateTask = (taskId, field, value) => {
                setTasks(tasks.map(t => t.id === taskId ? { ...t, [field]: value } : t));
            };

            const updatePart = (partId, field, value) => {
                setParts(parts.map(p => p.id === partId ? { ...p, [field]: value } : p));
            };

            const deleteTask = (taskId) => {
                setTasks(tasks.filter(t => t.id !== taskId));
            };

            const deletePart = (partId) => {
                setParts(parts.filter(p => p.id !== partId));
            };

            const filteredOrders = useMemo(() => {
                if (!orderSearch.trim()) return orders;
                const query = orderSearch.toLowerCase();
                return orders.filter(o => {
                    const vehicle = vehicles.find(v => v.id === o.vehicle_id);
                    const client = clients.find(c => c.id === vehicle?.client_id);
                    return (vehicle?.license_plate.toLowerCase() || '').includes(query) || (client?.name.toLowerCase() || '').includes(query);
                });
            }, [orders, vehicles, clients, orderSearch]);

            return (
                <div className="flex h-screen bg-slate-950 text-slate-100 overflow-hidden">
                    {/* BARRA LATERAL */}
                    <aside className="w-64 bg-slate-900 border-r border-slate-800 flex flex-col no-print">
                        <div className="p-4 border-b border-slate-800 flex items-center space-x-3">
                            <WorkshopLogo className="w-12 h-12 flex-shrink-0" />
                            <div>
                                <h1 className="font-bold text-xs leading-tight text-white">{workshopInfo.name}</h1>
                                <p className="text-[10px] text-orange-500 font-semibold">Taller Mecánico</p>
                            </div>
                        </div>
                        <nav className="flex-1 p-4 space-y-1.5 overflow-y-auto">
                            {[
                                { id: 'panel', label: 'Panel de Control', icon: '📊' },
                                { id: 'orders', label: 'Órdenes de Reparación', icon: '🔧' },
                                { id: 'clients', label: 'Clientes y Vehículos', icon: '👥' },
                                { id: 'workers', label: 'Trabajadores', icon: '👷' },
                                { id: 'reports', label: 'Informes y Rentabilidad', icon: '📈' },
                                { id: 'settings', label: 'Ajustes del Taller', icon: '⚙️' },
                            ].map(tab => (
                                <button
                                    key={tab.id}
                                    onClick={() => { setActiveTab(tab.id); setSelectedOrderId(null); }}
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl font-medium text-sm transition-all ${activeTab === tab.id ? 'bg-orange-500 text-slate-950 shadow-lg shadow-orange-500/20 font-bold' : 'text-slate-400 hover:bg-slate-800 hover:text-white'}`}
                                >
                                    <span className="text-lg">{tab.icon}</span>
                                    <span>{tab.label}</span>
                                </button>
                            ))}
                        </nav>
                        <div className="p-4 border-t border-slate-800 text-xs text-slate-500 text-center">
                            {workshopInfo.name} • NIF: {workshopInfo.nif}
                        </div>
                    </aside>

                    {/* CONTENEDOR PRINCIPAL */}
                    <main className="flex-1 flex flex-col overflow-hidden bg-slate-950">
                        <header className="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-6 no-print">
                            <div className="flex items-center space-x-4">
                                <span className="text-xs uppercase tracking-widest text-orange-500 font-bold bg-orange-500/10 px-3 py-1 rounded-full border border-orange-500/20">
                                    {activeTab.toUpperCase()}
                                </span>
                            </div>
                            <div className="flex items-center space-x-3">
                                <button
                                    onClick={() => setShowNewOrderModal(true)}
                                    className="bg-orange-500 hover:bg-orange-600 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold shadow-lg shadow-orange-500/20 transition-all flex items-center space-x-2"
                                >
                                    <span>+ Nueva Orden</span>
                                </button>
                            </div>
                        </header>

                        {/* VISTA DE FACTURA A4 */}
                        {activeInvoice && (
                            <div className="fixed inset-0 z-50 bg-slate-950/90 flex items-center justify-center p-4 overflow-y-auto">
                                <div className="bg-white text-slate-900 w-full max-w-3xl rounded-2xl shadow-2xl overflow-hidden my-8">
                                    <div className="bg-slate-900 text-white p-4 flex justify-between items-center no-print">
                                        <h3 className="font-bold text-lg">📄 Factura N° {activeInvoice.invoice_number}</h3>
                                        <div className="flex space-x-3">
                                            <button onClick={() => window.print()} className="bg-orange-500 hover:bg-orange-600 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold shadow transition-all">
                                                🖨️ Imprimir Factura A4
                                            </button>
                                            <button onClick={() => setActiveInvoice(null)} className="bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-xl text-sm font-semibold">
                                                Cerrar
                                            </button>
                                        </div>
                                    </div>
                                    <div className="p-10 space-y-8 bg-white text-slate-800">
                                        <div className="flex justify-between items-start border-b border-slate-200 pb-6">
                                            <div className="space-y-1">
                                                <div className="flex items-center space-x-3 mb-2">
                                                    <WorkshopLogo className="w-16 h-16 flex-shrink-0" />
                                                    <h1 className="text-2xl font-black text-slate-900 tracking-tight">{workshopInfo.name}</h1>
                                                </div>
                                                <p className="text-xs text-slate-600">NIF: {workshopInfo.nif}</p>
                                                <p className="text-xs text-slate-600">{workshopInfo.address}</p>
                                                <p className="text-xs text-slate-600">Tel: {workshopInfo.phone} | Email: {workshopInfo.email}</p>
                                            </div>
                                            <div className="text-right space-y-1">
                                                <h2 className="text-xl font-bold text-orange-600 uppercase tracking-wide">FACTURA</h2>
                                                <p className="text-sm font-bold text-slate-900">{activeInvoice.invoice_number}</p>
                                                <p className="text-xs text-slate-500">Fecha: {activeInvoice.date}</p>
                                            </div>
                                        </div>
                                        <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-2 gap-4 text-sm">
                                            <div>
                                                <span className="block text-xs font-semibold text-slate-400 uppercase">Receptor (Cliente):</span>
                                                <p className="font-bold text-slate-900 mt-1">{activeInvoice.client_name}</p>
                                                <p className="text-slate-600">NIF/CIF: {activeInvoice.client_nif}</p>
                                                <p className="text-slate-600">{activeInvoice.client_address}</p>
                                            </div>
                                            <div>
                                                <span className="block text-xs font-semibold text-slate-400 uppercase">Observaciones:</span>
                                                <p className="text-slate-700 mt-1 italic">{activeInvoice.notes || 'Sin observaciones.'}</p>
                                            </div>
                                        </div>
                                        <table className="w-full text-left text-sm border-collapse">
                                            <thead>
                                                <tr className="border-b-2 border-slate-300 text-slate-700">
                                                    <th className="py-3 px-2 font-bold">Concepto</th>
                                                    <th className="py-3 px-2 text-center font-bold">Cant.</th>
                                                    <th className="py-3 px-2 text-right font-bold">Importe Total</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {activeInvoice.lines.map((line, idx) => (
                                                    <tr key={idx}>
                                                        <td className="py-3 px-2 text-slate-800">{line.desc}</td>
                                                        <td className="py-3 px-2 text-center text-slate-600">{line.qty}</td>
                                                        <td className="py-3 px-2 text-right font-semibold text-slate-900">{line.amount.toFixed(2)} €</td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>
                                        <div className="flex justify-end pt-4 border-t border-slate-200">
                                            <div className="w-64 space-y-2 text-sm">
                                                <div className="flex justify-between text-slate-600"><span>Base Imponible:</span><span>{activeInvoice.subtotal.toFixed(2)} €</span></div>
                                                <div className="flex justify-between text-slate-600"><span>IVA (21%):</span><span>{activeInvoice.iva.toFixed(2)} €</span></div>
                                                <div className="flex justify-between text-base font-black text-slate-900 border-t border-slate-300 pt-2">
                                                    <span>TOTAL:</span><span className="text-orange-600">{activeInvoice.total.toFixed(2)} €</span>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        <div className="flex-1 overflow-y-auto p-6">
                            {/* PANEL */}
                            {activeTab === 'panel' && (
                                <div className="space-y-6 max-w-7xl mx-auto">
                                    <div className="grid grid-cols-1 md:grid-cols-4 gap-6">
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                            <p className="text-xs font-semibold text-slate-400 uppercase">Reparaciones Abiertas</p>
                                            <p className="text-3xl font-black text-white mt-2">{orders.filter(o => o.status === 'Abierta' || o.status === 'En curso').length}</p>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                            <p className="text-xs font-semibold text-slate-400 uppercase">Ingresos del Mes</p>
                                            <p className="text-3xl font-black text-emerald-400 mt-2">{financialSummary.income.toFixed(2)} €</p>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                            <p className="text-xs font-semibold text-slate-400 uppercase">Costes del Mes</p>
                                            <p className="text-3xl font-black text-rose-400 mt-2">{financialSummary.costs.toFixed(2)} €</p>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 shadow-lg">
                                            <p className="text-xs font-semibold text-slate-400 uppercase">Beneficio Neto</p>
                                            <p className={`text-3xl font-black mt-2 ${financialSummary.profit >= 0 ? 'text-orange-500' : 'text-rose-500'}`}>{financialSummary.profit.toFixed(2)} €</p>
                                        </div>
                                    </div>

                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                                        <h2 className="text-lg font-bold text-white mb-4">Órdenes en Curso</h2>
                                        <table className="w-full text-left text-sm">
                                            <thead>
                                                <tr className="border-b border-slate-800 text-slate-400">
                                                    <th className="pb-3 px-3">Matrícula</th>
                                                    <th className="pb-3 px-3">Cliente</th>
                                                    <th className="pb-3 px-3">Vehículo</th>
                                                    <th className="pb-3 px-3">Estado</th>
                                                    <th className="pb-3 px-3 text-right">Acción</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800">
                                                {orders.map(o => {
                                                    const vehicle = vehicles.find(v => v.id === o.vehicle_id);
                                                    const client = clients.find(c => c.id === vehicle?.client_id);
                                                    return (
                                                        <tr key={o.id}>
                                                            <td className="py-3 px-3 font-mono font-bold text-orange-500">{vehicle?.license_plate}</td>
                                                            <td className="py-3 px-3 text-slate-200">{client?.name}</td>
                                                            <td className="py-3 px-3 text-slate-400">{vehicle?.brand} {vehicle?.model}</td>
                                                            <td className="py-3 px-3"><span className="px-2 py-0.5 rounded-full text-xs bg-orange-500/10 text-orange-400 font-bold">{o.status}</span></td>
                                                            <td className="py-3 px-3 text-right">
                                                                <button onClick={() => setSelectedOrderId(o.id)} className="bg-slate-800 hover:bg-orange-500 hover:text-slate-950 text-slate-200 px-3 py-1 rounded-lg text-xs font-bold transition-all">Ver Detalle</button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* ÓRDENES */}
                            {activeTab === 'orders' && !selectedOrderId && (
                                <div className="space-y-6 max-w-7xl mx-auto">
                                    <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <input type="text" placeholder="🔍 Buscar por matrícula o cliente..." value={orderSearch} onChange={(e) => setOrderSearch(e.target.value)} className="w-96 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white focus:outline-none" />
                                        <button onClick={() => setShowNewOrderModal(true)} className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-sm font-bold">+ Nueva Orden</button>
                                    </div>
                                    <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-lg">
                                        <table className="w-full text-left text-sm">
                                            <thead>
                                                <tr className="border-b border-slate-800 text-slate-400">
                                                    <th className="pb-3 px-3">Orden #</th>
                                                    <th className="pb-3 px-3">Matrícula</th>
                                                    <th className="pb-3 px-3">Cliente</th>
                                                    <th className="pb-3 px-3">Vehículo</th>
                                                    <th className="pb-3 px-3">Estado</th>
                                                    <th className="pb-3 px-3 text-right">Acción</th>
                                                </tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-800">
                                                {filteredOrders.map(o => {
                                                    const vehicle = vehicles.find(v => v.id === o.vehicle_id);
                                                    const client = clients.find(c => c.id === vehicle?.client_id);
                                                    return (
                                                        <tr key={o.id}>
                                                            <td className="py-3 px-3 font-bold">ORD-{String(o.id).padStart(4, '0')}</td>
                                                            <td className="py-3 px-3 font-mono font-bold text-orange-500">{vehicle?.license_plate}</td>
                                                            <td className="py-3 px-3">{client?.name}</td>
                                                            <td className="py-3 px-3 text-slate-400">{vehicle?.brand} {vehicle?.model}</td>
                                                            <td className="py-3 px-3"><span className="px-2 py-0.5 rounded text-xs bg-slate-800">{o.status}</span></td>
                                                            <td className="py-3 px-3 text-right">
                                                                <button onClick={() => setSelectedOrderId(o.id)} className="bg-slate-800 hover:bg-orange-500 hover:text-slate-950 text-slate-200 px-3 py-1 rounded text-xs font-bold">Ver Detalle</button>
                                                            </td>
                                                        </tr>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            )}

                            {/* DETALLE DE ORDEN */}
                            {selectedOrderId && (() => {
                                const order = orders.find(o => o.id === selectedOrderId);
                                if (!order) return null;
                                const vehicle = vehicles.find(v => v.id === order.vehicle_id);
                                const client = clients.find(c => c.id === vehicle?.client_id);
                                const orderTasks = tasks.filter(t => t.order_id === order.id);
                                const orderParts = parts.filter(p => p.order_id === order.id);
                                const costs = getOrderCosts(order.id);
                                const beneficio = Number(order.charged_price || 0) - costs.totalCost;
                                const existingInvoice = invoices.find(i => i.order_id === order.id);

                                return (
                                    <div className="space-y-6 max-w-5xl mx-auto">
                                        <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                            <button onClick={() => setSelectedOrderId(null)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">← Volver</button>
                                            <div className="flex items-center space-x-3">
                                                <select value={order.status} onChange={(e) => setOrders(orders.map(o => o.id === order.id ? { ...o, status: e.target.value } : o))} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-orange-500 font-bold">
                                                    <option value="Abierta">Abierta</option>
                                                    <option value="En curso">En curso</option>
                                                    <option value="Terminada">Terminada</option>
                                                    <option value="Entregada">Entregada</option>
                                                </select>
                                                {existingInvoice && (
                                                    <button onClick={() => setActiveInvoice(existingInvoice)} className="bg-blue-600 text-white px-3 py-1.5 rounded-xl text-xs font-bold">📄 Ver Factura</button>
                                                )}
                                            </div>
                                        </div>

                                        <div className="grid grid-cols-2 gap-6">
                                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-2">
                                                <h3 className="text-xs font-semibold text-orange-500 uppercase">Cliente</h3>
                                                <p className="font-bold text-white">{client?.name}</p>
                                                <p className="text-xs text-slate-400">NIF: {client?.nif} | Tel: {client?.phone}</p>
                                            </div>
                                            <div className="bg-slate-900 border border-slate-800 p-5 rounded-2xl space-y-2">
                                                <h3 className="text-xs font-semibold text-orange-500 uppercase">Vehículo</h3>
                                                <p className="font-bold text-white font-mono">{vehicle?.license_plate}</p>
                                                <p className="text-xs text-slate-400">{vehicle?.brand} {vehicle?.model}</p>
                                            </div>
                                        </div>

                                        {/* Tareas */}
                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                                            <h3 className="font-bold text-white text-sm">🛠️ Mano de Obra</h3>
                                            <div className="space-y-2">
                                                {orderTasks.map(t => (
                                                    <div key={t.id} className="grid grid-cols-12 gap-2 items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                                                        <input 
                                                            type="text" 
                                                            value={t.description} 
                                                            onChange={(e) => updateTask(t.id, 'description', e.target.value)} 
                                                            className="col-span-5 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white" 
                                                        />
                                                        <select 
                                                            value={t.worker_id} 
                                                            onChange={(e) => updateTask(t.id, 'worker_id', Number(e.target.value))} 
                                                            className="col-span-4 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white"
                                                        >
                                                            {workers.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                                                        </select>
                                                        <input 
                                                            type="number" 
                                                            step="0.5" 
                                                            value={t.hours} 
                                                            onChange={(e) => updateTask(t.id, 'hours', Number(e.target.value))} 
                                                            className="col-span-2 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white text-center font-bold text-orange-500" 
                                                        />
                                                        <button 
                                                            type="button" 
                                                            onClick={() => deleteTask(t.id)} 
                                                            className="col-span-1 text-slate-500 hover:text-rose-400 text-center font-bold text-xs"
                                                            title="Eliminar tarea"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                            <form onSubmit={addTaskToOrder} className="grid grid-cols-12 gap-2 pt-2 border-t border-slate-800">
                                                <input type="text" placeholder="Nueva tarea..." value={newTaskForm.description} onChange={(e) => setNewTaskForm({ ...newTaskForm, description: e.target.value })} className="col-span-6 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                                                <select value={newTaskForm.worker_id} onChange={(e) => setNewTaskForm({ ...newTaskForm, worker_id: e.target.value })} className="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white">
                                                    <option value="">Trabajador</option>
                                                    {workers.map(w => <option key={w.id} value={w.id}>{w.name}</option>)}
                                                </select>
                                                <input type="number" step="0.5" placeholder="Horas" value={newTaskForm.hours} onChange={(e) => setNewTaskForm({ ...newTaskForm, hours: e.target.value })} className="col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                                                <button type="submit" className="col-span-1 bg-orange-500 text-slate-950 rounded-xl text-xs font-bold">+</button>
                                            </form>
                                        </div>

                                        {/* Piezas */}
                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl space-y-4">
                                            <h3 className="font-bold text-white text-sm">📦 Recambios</h3>
                                            <div className="space-y-2">
                                                {orderParts.map(p => (
                                                    <div key={p.id} className="grid grid-cols-12 gap-2 items-center bg-slate-950 p-2 rounded-xl border border-slate-800">
                                                        <input 
                                                            type="text" 
                                                            value={p.description} 
                                                            onChange={(e) => updatePart(p.id, 'description', e.target.value)} 
                                                            className="col-span-6 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white" 
                                                        />
                                                        <input 
                                                            type="number" 
                                                            value={p.quantity} 
                                                            onChange={(e) => updatePart(p.id, 'quantity', Number(e.target.value))} 
                                                            className="col-span-2 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white text-center" 
                                                        />
                                                        <input 
                                                            type="number" 
                                                            step="0.01" 
                                                            value={p.unit_cost} 
                                                            onChange={(e) => updatePart(p.id, 'unit_cost', Number(e.target.value))} 
                                                            className="col-span-3 bg-slate-900 border border-slate-800 rounded-lg px-2 py-1 text-xs text-white text-right font-bold text-orange-500" 
                                                        />
                                                        <button 
                                                            type="button" 
                                                            onClick={() => deletePart(p.id)} 
                                                            className="col-span-1 text-slate-500 hover:text-rose-400 text-center font-bold text-xs"
                                                            title="Eliminar recambio"
                                                        >
                                                            ✕
                                                        </button>
                                                    </div>
                                                ))}
                                            </div>
                                            <form onSubmit={addPartToOrder} className="grid grid-cols-12 gap-2 pt-2 border-t border-slate-800">
                                                <input type="text" placeholder="Pieza..." value={newPartForm.description} onChange={(e) => setNewPartForm({ ...newPartForm, description: e.target.value })} className="col-span-6 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                                                <input type="number" placeholder="Cant." value={newPartForm.quantity} onChange={(e) => setNewPartForm({ ...newPartForm, quantity: e.target.value })} className="col-span-2 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                                                <input type="number" step="0.01" placeholder="Coste" value={newPartForm.unit_cost} onChange={(e) => setNewPartForm({ ...newPartForm, unit_cost: e.target.value })} className="col-span-3 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white" />
                                                <button type="submit" className="col-span-1 bg-orange-500 text-slate-950 rounded-xl text-xs font-bold">+</button>
                                            </form>
                                        </div>

                                        {/* Rentabilidad */}
                                        <div className="bg-slate-900 border border-slate-800 p-6 rounded-2xl grid grid-cols-2 gap-6">
                                            <div className="space-y-2 text-sm">
                                                <h3 className="font-bold text-orange-500 uppercase text-xs">Rentabilidad</h3>
                                                <div className="flex justify-between text-slate-400"><span>Coste Total:</span><span className="text-white font-bold">{costs.totalCost.toFixed(2)} €</span></div>
                                                <div className="flex justify-between text-slate-400"><span>Beneficio:</span><span className={beneficio >= 0 ? 'text-orange-500 font-bold' : 'text-rose-500 font-bold'}>{beneficio.toFixed(2)} €</span></div>
                                            </div>
                                            <div className="space-y-3">
                                                <label className="block text-xs font-semibold text-slate-400 uppercase">Precio Cobrado (€ IVA incl.)</label>
                                                <div className="flex space-x-2">
                                                    <input type="number" step="0.01" defaultValue={order.charged_price} id={`price-${order.id}`} className="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-sm text-white font-bold" />
                                                    <button onClick={() => handleSaveChargedPrice(order.id, document.getElementById(`price-${order.id}`).value)} className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Guardar y Facturar</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })()}

                            {/* CLIENTES */}
                            {activeTab === 'clients' && (
                                <div className="space-y-6 max-w-7xl mx-auto">
                                    <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <h2 className="text-lg font-bold text-white">Clientes y Vehículos</h2>
                                        <div className="space-x-3">
                                            <button onClick={() => setShowNewVehicleModal(true)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">+ Vehículo</button>
                                            <button onClick={() => setShowNewClientModal(true)} className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">+ Cliente</button>
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-6">
                                        {clients.map(c => (
                                            <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-lg">
                                                <div className="flex justify-between">
                                                    <div><h3 className="font-bold text-white">{c.name}</h3><p className="text-xs text-orange-500">NIF: {c.nif}</p></div>
                                                    <div className="text-right text-xs text-slate-400"><p>📞 {c.phone}</p><p>✉️ {c.email}</p></div>
                                                </div>
                                                <div className="border-t border-slate-800 pt-3">
                                                    <p className="text-xs font-semibold text-slate-400 uppercase mb-2">Vehículos:</p>
                                                    {vehicles.filter(v => v.client_id === c.id).map(v => (
                                                        <div key={v.id} className="bg-slate-950 p-2 rounded-xl border border-slate-800 flex justify-between text-xs mb-1">
                                                            <span className="font-mono font-bold text-orange-400">{v.license_plate}</span>
                                                            <span className="text-slate-300">{v.brand} {v.model} ({v.year})</span>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* TRABAJADORES */}
                            {activeTab === 'workers' && (
                                <div className="space-y-6 max-w-7xl mx-auto">
                                    <div className="flex justify-between items-center bg-slate-900 border border-slate-800 p-4 rounded-2xl">
                                        <h2 className="text-lg font-bold text-white">Gestión de Trabajadores</h2>
                                        <button onClick={() => setShowNewWorkerModal(true)} className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">+ Nuevo Trabajador</button>
                                    </div>

                                    <div className="grid grid-cols-3 gap-6">
                                        {workers.map(w => {
                                            const totalHours = tasks.filter(t => t.worker_id === w.id).reduce((acc, t) => acc + Number(t.hours), 0);
                                            return (
                                                <div key={w.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4 shadow-lg relative">
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <h3 className="font-bold text-white text-base">{w.name}</h3>
                                                            <span className={`inline-block mt-1 px-2.5 py-0.5 rounded-full text-[10px] font-bold ${
                                                                w.status === 'Activo' ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' :
                                                                w.status === 'De vacaciones' ? 'bg-amber-500/10 text-amber-400 border border-amber-500/20' :
                                                                'bg-rose-500/10 text-rose-400 border border-rose-500/20'
                                                            }`}>
                                                                ● {w.status || 'Activo'}
                                                            </span>
                                                        </div>
                                                        <button
                                                            onClick={() => setWorkerToDelete(w)}
                                                            className="text-slate-500 hover:text-rose-400 p-1 text-xs font-bold transition-all"
                                                            title="Eliminar trabajador"
                                                        >
                                                            🗑️ Eliminar
                                                        </button>
                                                    </div>
                                                    <div className="border-t border-slate-800 pt-3 text-sm space-y-1">
                                                        <div className="flex justify-between text-slate-400"><span>Coste hora:</span><span className="text-orange-500 font-bold">{w.cost_hour} €/h</span></div>
                                                        <div className="flex justify-between text-slate-400"><span>Horas mes:</span><span className="text-white font-bold">{totalHours} h</span></div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* INFORMES */}
                            {activeTab === 'reports' && (
                                <div className="space-y-6 max-w-7xl mx-auto">
                                    <div className="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex justify-between items-center">
                                        <h2 className="text-lg font-bold text-white">Informes y Rentabilidad</h2>
                                        <div className="flex space-x-2 text-xs">
                                            <input type="date" value={reportStart} onChange={(e) => setReportStart(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1 text-white" />
                                            <input type="date" value={reportEnd} onChange={(e) => setReportEnd(e.target.value)} className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-1 text-white" />
                                        </div>
                                    </div>
                                    <div className="grid grid-cols-3 gap-6">
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                            <p className="text-xs text-slate-400 uppercase">Ingresos</p>
                                            <p className="text-3xl font-black text-emerald-400 mt-2">{financialSummary.income.toFixed(2)} €</p>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                            <p className="text-xs text-slate-400 uppercase">Costes</p>
                                            <p className="text-3xl font-black text-rose-400 mt-2">{financialSummary.costs.toFixed(2)} €</p>
                                        </div>
                                        <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6">
                                            <p className="text-xs text-slate-400 uppercase">Beneficio Neto</p>
                                            <p className="text-3xl font-black text-orange-500 mt-2">{financialSummary.profit.toFixed(2)} €</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* AJUSTES */}
                            {activeTab === 'settings' && (
                                <div className="space-y-6 max-w-3xl mx-auto bg-slate-900 border border-slate-800 p-8 rounded-2xl shadow-lg">
                                    <h2 className="text-xl font-bold text-white">Ajustes Fiscales</h2>
                                    <div className="space-y-4 text-sm">
                                        <div><label className="block text-xs text-slate-400 uppercase">Nombre</label><input type="text" value={workshopInfo.name} readOnly className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white" /></div>
                                        <div className="grid grid-cols-2 gap-4">
                                            <div><label className="block text-xs text-slate-400 uppercase">NIF</label><input type="text" value={workshopInfo.nif} readOnly className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white" /></div>
                                            <div><label className="block text-xs text-slate-400 uppercase">Teléfono</label><input type="text" value={workshopInfo.phone} readOnly className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white" /></div>
                                        </div>
                                        <div><label className="block text-xs text-slate-400 uppercase">Dirección</label><input type="text" value={workshopInfo.address} readOnly className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-white" /></div>
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    {/* MODAL DE CONFIRMACIÓN DE BORRADO DE TRABAJADOR */}
                    {workerToDelete && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-sm rounded-2xl p-6 space-y-4 shadow-2xl text-center">
                                <div className="text-3xl">⚠️</div>
                                <h3 className="font-bold text-lg text-white">¿Está seguro?</h3>
                                <p className="text-xs text-slate-400">Va a eliminar al trabajador <strong className="text-white">{workerToDelete.name}</strong>. Esta acción no se puede deshacer y puede afectar al cálculo histórico de costes.</p>
                                <div className="flex justify-center space-x-3 pt-2">
                                    <button onClick={() => setWorkerToDelete(null)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Cancelar</button>
                                    <button onClick={confirmDeleteWorker} className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold">Sí, eliminar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODALES DE CREACIÓN */}
                    {showNewOrderModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-lg text-white">Nueva Orden</h3>
                                <form onSubmit={createOrder} className="space-y-4 text-sm">
                                    <div>
                                        <label className="block text-xs text-slate-400 uppercase mb-1">Vehículo</label>
                                        <select value={newOrderForm.vehicle_id} onChange={(e) => setNewOrderForm({ ...newOrderForm, vehicle_id: e.target.value })} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white">
                                            <option value="">Selecciona vehículo...</option>
                                            {vehicles.map(v => <option key={v.id} value={v.id}>{v.license_plate} - {v.brand} {v.model}</option>)}
                                        </select>
                                    </div>
                                    <div className="flex justify-end space-x-3"><button type="button" onClick={() => setShowNewOrderModal(false)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Cancelar</button><button type="submit" className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Crear</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewWorkerModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-lg text-white">Nuevo Trabajador</h3>
                                <form onSubmit={createWorker} className="space-y-3 text-sm">
                                    <input type="text" placeholder="Nombre" value={newWorkerForm.name} onChange={(e) => setNewWorkerForm({ ...newWorkerForm, name: e.target.value })} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="number" step="0.5" placeholder="Coste/Hora (€)" value={newWorkerForm.cost_hour} onChange={(e) => setNewWorkerForm({ ...newWorkerForm, cost_hour: e.target.value })} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <div>
                                        <label className="block text-xs text-slate-400 uppercase mb-1">Estado Laboral</label>
                                        <select value={newWorkerForm.status} onChange={(e) => setNewWorkerForm({ ...newWorkerForm, status: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white">
                                            <option value="Activo">Activo</option>
                                            <option value="De vacaciones">De vacaciones</option>
                                            <option value="De baja">De baja</option>
                                        </select>
                                    </div>
                                    <div className="flex justify-end space-x-3 pt-2"><button type="button" onClick={() => setShowNewWorkerModal(false)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Cancelar</button><button type="submit" className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Guardar</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewClientModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-lg text-white">Nuevo Cliente</h3>
                                <form onSubmit={createClient} className="space-y-3 text-sm">
                                    <input type="text" placeholder="Nombre" value={newClientForm.name} onChange={(e) => setNewClientForm({ ...newClientForm, name: e.target.value })} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="text" placeholder="NIF/CIF" value={newClientForm.nif} onChange={(e) => setNewClientForm({ ...newClientForm, nif: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="text" placeholder="Dirección" value={newClientForm.address} onChange={(e) => setNewClientForm({ ...newClientForm, address: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="text" placeholder="Teléfono" value={newClientForm.phone} onChange={(e) => setNewClientForm({ ...newClientForm, phone: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="email" placeholder="Email" value={newClientForm.email} onChange={(e) => setNewClientForm({ ...newClientForm, email: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <div className="flex justify-end space-x-3 pt-2"><button type="button" onClick={() => setShowNewClientModal(false)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Cancelar</button><button type="submit" className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Guardar</button></div>
                                </form>
                            </div>
                        </div>
                    )}

                    {showNewVehicleModal && (
                        <div className="fixed inset-0 z-50 bg-slate-950/80 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-6 space-y-4 shadow-2xl">
                                <h3 className="font-bold text-lg text-white">Nuevo Vehículo</h3>
                                <form onSubmit={createVehicle} className="space-y-3 text-sm">
                                    <select value={newVehicleForm.client_id} onChange={(e) => setNewVehicleForm({ ...newVehicleForm, client_id: e.target.value })} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white">
                                        <option value="">Selecciona cliente...</option>
                                        {clients.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                                    </select>
                                    <input type="text" placeholder="Matrícula (ej: 1234 ABC)" value={newVehicleForm.license_plate} onChange={(e) => setNewVehicleForm({ ...newVehicleForm, license_plate: e.target.value.toUpperCase() })} required className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white font-mono" />
                                    <input type="text" placeholder="Marca" value={newVehicleForm.brand} onChange={(e) => setNewVehicleForm({ ...newVehicleForm, brand: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="text" placeholder="Modelo" value={newVehicleForm.model} onChange={(e) => setNewVehicleForm({ ...newVehicleForm, model: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <input type="number" placeholder="Año" value={newVehicleForm.year} onChange={(e) => setNewVehicleForm({ ...newVehicleForm, year: e.target.value })} className="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2 text-white" />
                                    <div className="flex justify-end space-x-3 pt-2"><button type="button" onClick={() => setShowNewVehicleModal(false)} className="bg-slate-800 text-white px-4 py-2 rounded-xl text-xs font-bold">Cancelar</button><button type="submit" className="bg-orange-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-bold">Guardar</button></div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
